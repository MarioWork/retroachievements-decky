# Yarn 4's default PnP linker breaks rollup, vite and pyright, all of which
# resolve modules by walking node_modules on disk. node-modules keeps a real tree.
nodeLinker: node-modules

# Committed to the repo, so the project builds with no corepack and no global
# yarn install -- which matters here, where `corepack enable` fails with EPERM.
yarnPath: .yarn/releases/yarn-4.18.0.cjs
